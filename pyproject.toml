authors = [
    { name = "vladkuz54", email = "vkuz1540@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "black>=26.10.1",
